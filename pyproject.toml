[project]
name = "rag-tutorial"
version = "0.2.0"
description = "Учебный RAG на русскоязычных данных (SberQuAD): hybrid retrieval (BM25 + dense) + RRF + cross-encoder reranking + LLM-генерация с цитированием"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "datasets>=2.18",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
